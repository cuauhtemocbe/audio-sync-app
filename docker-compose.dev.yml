services:
  audio-sync-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app
    # Sin "--" antes de --host: con pnpm (a diferencia de npm), "pnpm run dev -- --host" hace que
    # vite reciba el flag pero lo ignore (banner "Network: use --host to expose", sin bindear a
    # 0.0.0.0) — "pnpm run dev --host" a secas sí lo pasa correctamente. Bug reproducido y aislado
    # el 2026-07-18: con "--" vite ni siquiera respeta --port, cae al auto-incremento default.
    command: sh -c "sfw pnpm install && pnpm run dev --host"
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5173/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
