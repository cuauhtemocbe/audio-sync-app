services:
  audio-sync-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      # UID/GID del usuario que invoca `make` (ver Dockerfile.dev) — el Makefile los exporta al
      # entorno antes de correr docker compose, así que por default esto no cambia nada.
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    # Sin "--" antes de --host: con pnpm (a diferencia de npm), "pnpm run dev -- --host" hace que
    # vite reciba el flag pero lo ignore (banner "Network: use --host to expose", sin bindear a
    # 0.0.0.0) — "pnpm run dev --host" a secas sí lo pasa correctamente. Bug reproducido y aislado
    # el 2026-07-18: con "--" vite ni siquiera respeta --port, cae al auto-incremento default.
    command: sh -c "sfw pnpm install && pnpm run dev --host"
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    # Sin healthcheck: propio acá — el HEALTHCHECK de Dockerfile.dev ya cubre esto (start_period
    # calibrado ahí, con el porqué documentado). Tener los dos por separado hizo que este bloque
    # pisara en silencio el start_period del Dockerfile durante toda una sesión de debugging.
